<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0B0906">
<meta name="format-detection" content="telephone=no">
<title>粤港澳排球邀请赛</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&amp;family=Noto+Serif+SC:wght@700;900&amp;family=Barlow+Condensed:wght@500;600;700&amp;display=swap">
<style id="app-style">
:root{
  --ink:#0B0906; --ink-1:#12100B; --ink-2:#1A1610; --ink-3:#241E14;
  --line:#3A2F1D; --line-soft:#2A2317;
  --gold:#E0B24F; --gold-hi:#F7E3A6; --gold-deep:#8C6421; --gold-dim:#A98B4E;
  --paper:#F2ECE0; --muted:#9C907B; --muted-2:#6F6552;
  --live:#E2574C; --done:#57A98A; --wait:#7A6E58;
  --r:4px; --rl:10px;
  --w:min(1120px, 100% - 32px);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ink);color:var(--paper);
  font-family:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{max-width:100%;display:block}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--gold);text-decoration:none}
a:hover{color:var(--gold-hi)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
[hidden]{display:none !important}
h1,h2,h3,h4,p{margin:0}
table{border-collapse:collapse}

/* ---------- 背景层：金光 · 天际线 · 纹样 ---------- */
.bg{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.bg .glow{position:absolute;inset:0;
  background:
   radial-gradient(1150px 640px at 80% -10%, rgba(224,178,79,.20), transparent 62%),
   radial-gradient(820px 560px at 2% 10%, rgba(140,100,33,.16), transparent 60%),
   radial-gradient(1000px 760px at 50% 108%, rgba(224,178,79,.10), transparent 66%)}
/* 斜向金色光带，取自海报的“光轨”元素 */
.bg .rays{position:absolute;left:-40%;top:-30%;width:180%;height:170%;
  transform:rotate(-19deg);opacity:.5;
  background:repeating-linear-gradient(90deg,
    transparent 0 62px,
    rgba(224,178,79,.055) 62px 63px,
    transparent 63px 96px,
    rgba(247,227,166,.085) 96px 97.4px,
    transparent 97.4px 190px);
  -webkit-mask-image:radial-gradient(58% 46% at 62% 26%,#000 0%,transparent 78%);
  mask-image:radial-gradient(58% 46% at 62% 26%,#000 0%,transparent 78%);
  animation:drift 26s ease-in-out infinite alternate}
@keyframes drift{from{transform:rotate(-19deg) translateX(0)}to{transform:rotate(-19deg) translateX(46px)}}
/* 海报元素：金球 与 扣球剪影（纯设计元素，无文字） */
.bg .el{position:absolute;mix-blend-mode:screen;display:block;pointer-events:none}
.bg .elball{right:-14%;top:26px;width:70%;max-width:560px;opacity:.3;
  -webkit-mask-image:radial-gradient(closest-side,#000 56%,transparent 96%);
  mask-image:radial-gradient(closest-side,#000 56%,transparent 96%);
  animation:float 15s ease-in-out infinite alternate}
.bg .elplay{left:-9%;bottom:96px;width:46%;max-width:360px;opacity:.17;
  -webkit-mask-image:linear-gradient(96deg,#000 46%,transparent 92%);
  mask-image:linear-gradient(96deg,#000 46%,transparent 92%)}
@keyframes float{from{transform:translateY(0) rotate(0deg)}to{transform:translateY(-16px) rotate(8deg)}}
@media(min-width:900px){.bg .elball{width:40%;right:1%;top:10px}
  .bg .elplay{width:22%;left:0;bottom:120px}}
/* 右上角莲花 / 月饼纹样 */
.bg .orn{position:absolute;right:-70px;top:52px;width:330px;height:330px;opacity:.22}
.bg .orn2{position:absolute;left:-90px;bottom:190px;width:260px;height:260px;opacity:.13}
/* 底部粤港澳天际线 */
.bg .sky{position:absolute;left:0;right:0;bottom:0;height:190px;opacity:.42}
.bg .sky svg{width:100%;height:100%;display:block}
@media(max-width:700px){.bg .orn{width:210px;height:210px;right:-64px;opacity:.19}
  .bg .orn2{display:none}.bg .sky{height:130px;opacity:.34}.bg .rays{opacity:.34}}

/* ---------- top bar ---------- */
.bar{position:sticky;top:0;z-index:40;background:rgba(11,9,6,.9);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line-soft)}
.bar-in{width:var(--w);margin:0 auto;display:flex;align-items:center;gap:12px;height:54px}
.brand{display:flex;align-items:center;gap:9px;min-width:0;flex:1}
.seal{width:26px;height:26px;flex:none;border-radius:50%;
  background:radial-gradient(circle at 34% 30%, var(--gold-hi), var(--gold) 42%, var(--gold-deep) 100%);
  box-shadow:0 0 0 1px rgba(247,227,166,.4), 0 0 14px rgba(224,178,79,.35);position:relative}
.seal::after{content:"";position:absolute;inset:6px;border-radius:50%;
  border:1px solid rgba(11,9,6,.55)}
.brand b{font-family:"Noto Serif SC",serif;font-weight:900;font-size:16px;letter-spacing:.06em;
  background:linear-gradient(100deg,var(--gold-hi),var(--gold) 52%,var(--gold-deep));
  -webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}
.brand span{font-size:11px;color:var(--muted-2);letter-spacing:.14em;white-space:nowrap;
  display:block;overflow:hidden;text-overflow:ellipsis}
@media(max-width:480px){.brand span{font-size:9.5px;letter-spacing:.08em}}
.bar-act{display:flex;gap:5px;flex:none}
.mini.lang{padding:5px 8px;letter-spacing:.02em}
@media(max-width:430px){
  .bar-act{gap:4px}
  .mini.lang{padding:5px 6px;font-size:11.5px}
  .bar-act .mini{padding:5px 7px;font-size:11.5px}
}
.mini{border:1px solid var(--line);background:transparent;color:var(--muted);
  border-radius:var(--r);padding:5px 9px;font-size:12px;cursor:pointer;white-space:nowrap;
  transition:border-color .18s,color .18s}
.mini:hover{border-color:var(--gold-deep);color:var(--gold)}
.mini.on{border-color:var(--gold);color:var(--ink);background:var(--gold);font-weight:700}

/* ---------- nav ---------- */
.nav{position:sticky;top:54px;z-index:39;background:rgba(11,9,6,.94);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line-soft)}
.nav-in{width:var(--w);margin:0 auto;display:flex;gap:2px;overflow-x:auto;
  scrollbar-width:none;-ms-overflow-style:none}
.nav-in::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;background:transparent;color:var(--muted);cursor:pointer;
  padding:11px 13px 9px;font-size:14px;font-weight:500;letter-spacing:.03em;
  border-bottom:2px solid transparent;transition:color .18s,border-color .18s}
.tab:hover{color:var(--paper)}
.tab[aria-selected="true"]{color:var(--gold-hi);border-bottom-color:var(--gold);font-weight:700}
.tab .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--live);
  margin-left:5px;vertical-align:middle;animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}

/* ---------- shell ---------- */
main{position:relative;z-index:1;width:var(--w);margin:0 auto;padding:22px 0 90px}
.pane{display:none}
.pane.on{display:block;animation:fade .35s ease both}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}

/* section heads */
.sh{display:flex;align-items:baseline;gap:10px;margin:26px 0 12px}
.sh:first-child{margin-top:4px}
.sh h2{font-family:"Noto Serif SC",serif;font-weight:700;font-size:17px;letter-spacing:.05em;color:var(--gold-hi)}
.sh em{font-style:normal;font-size:11px;letter-spacing:.16em;color:var(--muted-2);text-transform:uppercase;
  font-family:"Barlow Condensed",sans-serif}
.sh .rule{flex:1;height:1px;background:linear-gradient(90deg,var(--gold-deep),transparent)}

/* ---------- hero（用海报元素拼合） ---------- */
.hero{position:relative;margin:-22px calc((100vw - var(--w)) / -2) 0;
  padding:34px calc((100vw - var(--w)) / 2) 26px;overflow:hidden;isolation:isolate}
.hero .helm{position:absolute;inset:0;z-index:-1;pointer-events:none}
.hero .helm::after{content:"";position:absolute;inset:0;
  background:linear-gradient(96deg,rgba(11,9,6,.9) 2%,rgba(11,9,6,.6) 44%,rgba(11,9,6,.18) 80%,transparent)}
.hero .eyeb{font-family:"Barlow Condensed",sans-serif;font-size:11px;letter-spacing:.32em;
  color:var(--gold-dim);text-transform:uppercase}
.hero .yr{font-family:"Barlow Condensed",sans-serif;font-size:clamp(46px,15vw,86px);font-weight:700;
  line-height:.86;letter-spacing:.01em;margin-top:6px;
  background:linear-gradient(98deg,var(--gold-hi) 6%,var(--gold) 44%,var(--gold-deep) 98%);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.hero .yr em{font-family:"Noto Serif SC",serif;font-style:normal;font-size:.26em;
  letter-spacing:.1em;margin-left:10px;vertical-align:.85em}
.hero h1{font-family:"Noto Serif SC",serif;font-weight:900;font-size:clamp(25px,7.6vw,42px);
  line-height:1.16;letter-spacing:.03em;margin-top:6px;text-wrap:balance;
  background:linear-gradient(96deg,var(--gold-hi) 4%,var(--gold) 50%,var(--gold-deep) 98%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 18px rgba(224,178,79,.22))}
.hero .slogan{margin-top:12px;font-size:12.5px;letter-spacing:.3em;color:var(--gold-dim)}
.hero .en{margin-top:4px;font-family:"Barlow Condensed",sans-serif;font-size:10.5px;
  letter-spacing:.16em;color:var(--muted-2);text-transform:uppercase}

.facts{display:grid;grid-template-columns:1fr 1fr;gap:1px;
  margin-top:18px;background:var(--line-soft);border:1px solid var(--line-soft);
  border-radius:var(--rl);overflow:hidden}
@media(min-width:700px){.facts{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}}
.fact{background:rgba(18,16,11,.82);padding:12px 13px}
.fact dt{font-size:10px;letter-spacing:.18em;color:var(--muted-2);margin-bottom:3px}
.fact dd{margin:0;font-size:13.5px;font-weight:500;color:var(--paper);line-height:1.45}

/* countdown */
.cd{margin-top:16px;border:1px solid var(--gold-deep);border-radius:var(--rl);
  background:linear-gradient(120deg,rgba(224,178,79,.14),rgba(18,16,11,.9) 62%);
  padding:14px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.cd .cdl{font-size:10.5px;letter-spacing:.24em;color:var(--gold-dim)}
.cd .cdv{font-family:"Barlow Condensed",sans-serif;font-size:clamp(30px,9vw,40px);font-weight:700;
  line-height:1;color:var(--gold-hi);font-variant-numeric:tabular-nums;letter-spacing:.02em;margin-top:3px}
.cd .cdv small{font-size:.4em;color:var(--muted);margin:0 9px 0 3px;font-weight:500}


/* 参赛队伍总览 */
.tlist{display:grid;grid-template-columns:1fr;gap:1px;background:var(--line-soft);
  border:1px solid var(--line-soft);border-radius:var(--rl);overflow:hidden}
@media(min-width:660px){.tlist{grid-template-columns:1fr 1fr}}
.tgh{background:var(--ink-3);padding:7px 13px;font-size:10.5px;letter-spacing:.22em;
  color:var(--gold-dim);grid-column:1/-1}
@media(min-width:660px){.tgh{grid-column:auto}}
.trow{background:rgba(18,16,11,.86);padding:10px 13px;display:flex;align-items:center;gap:10px}
.seed{font-family:"Barlow Condensed",sans-serif;font-size:13px;font-weight:700;letter-spacing:.04em;
  min-width:26px;height:22px;display:inline-flex;align-items:center;justify-content:center;
  border:1px solid var(--gold-deep);border-radius:3px;color:var(--gold);flex:none;
  font-variant-numeric:tabular-nums}
.trow .nm{font-size:14.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow .rg{margin-left:auto;font-size:11px;color:var(--muted-2);flex:none}

/* ---------- announcements ---------- */
.ann{border-left:2px solid var(--gold-deep);padding:2px 0 2px 14px;margin-bottom:14px}
.ann.pin{border-left-color:var(--gold)}
.ann h4{font-size:14.5px;font-weight:700;color:var(--paper);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ann time{font-family:"Barlow Condensed",sans-serif;font-size:12px;letter-spacing:.08em;color:var(--muted-2)}
.ann p{font-size:13.5px;color:var(--muted);margin-top:3px;white-space:pre-wrap}
.pinchip{font-size:10px;letter-spacing:.1em;background:var(--gold);color:var(--ink);
  padding:1px 6px;border-radius:2px;font-weight:700}

/* ---------- match rows ---------- */
.slot{margin-bottom:2px}
.slot-h{display:flex;align-items:center;gap:9px;padding:14px 0 6px}
.slot-h b{font-family:"Barlow Condensed",sans-serif;font-size:15px;letter-spacing:.09em;
  color:var(--gold-dim);font-variant-numeric:tabular-nums}
.slot-h i{flex:1;height:1px;background:var(--line-soft);font-style:normal}
.pairs{display:grid;grid-template-columns:1fr;gap:1px;background:var(--line-soft)}
@media(min-width:760px){.pairs{grid-template-columns:1fr 1fr}
  .pairs.one{grid-template-columns:1fr}}
.m{background:var(--ink-1);padding:11px 13px;display:grid;
  grid-template-columns:38px 1fr auto;gap:11px;align-items:center;position:relative}
.m.live{background:linear-gradient(100deg,rgba(226,87,76,.13),var(--ink-2));
  box-shadow:inset 2px 0 0 var(--live)}
.m.final{background:var(--ink-1)}
.m .no{font-family:"Barlow Condensed",sans-serif;font-size:19px;font-weight:600;
  color:var(--muted-2);text-align:center;font-variant-numeric:tabular-nums;line-height:1}
.m .no em{display:block;font-style:normal;font-size:9px;letter-spacing:.1em;color:var(--muted-2);margin-top:2px}
.m .who{min-width:0}
.side{display:flex;align-items:center;gap:8px;padding:1px 0}
.side .nm{font-size:14.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side .sc{margin-left:auto;font-family:"Barlow Condensed",sans-serif;font-size:19px;font-weight:700;
  font-variant-numeric:tabular-nums;color:var(--muted-2);line-height:1.15;min-width:16px;text-align:right}
.side.w .nm{color:var(--gold-hi);font-weight:700}
.side.w .sc{color:var(--gold-hi)}
.m .meta{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}
.chip{font-size:10px;letter-spacing:.1em;padding:2px 7px;border-radius:2px;
  border:1px solid var(--line);color:var(--muted-2);white-space:nowrap}
.chip.live{border-color:var(--live);color:#F2AAA3;background:rgba(226,87,76,.12)}
.chip.final{border-color:var(--line);color:var(--done)}
.chip.stage{border-color:var(--gold-deep);color:var(--gold-dim)}
.sets{font-family:"Barlow Condensed",sans-serif;font-size:11.5px;letter-spacing:.06em;
  color:var(--muted-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.m .ref{font-size:10.5px;color:var(--muted-2)}
.divider{grid-column:1/-1;background:var(--ink-3);color:var(--gold-dim);font-size:12px;
  letter-spacing:.24em;text-align:center;padding:7px}

/* filters */
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 2px}

/* ---------- 赛程总览表 ---------- */
.ovt{width:100%;min-width:720px;font-size:12.5px;border-collapse:collapse}
.ovt th,.ovt td{border:1px solid var(--line-soft);padding:6px 7px;text-align:center;
  font-variant-numeric:tabular-nums;white-space:nowrap}
.ovt thead th{background:var(--ink-3);color:var(--gold-dim);font-weight:500;font-size:10.5px;
  letter-spacing:.1em}
.ovt .day,.ovt .ev{background:var(--ink-2);color:var(--gold-dim);font-size:11.5px;
  letter-spacing:.2em;text-align:left;padding-left:13px;position:sticky;left:0}
.ovt .ev{letter-spacing:.26em}
.ovt .no2{font-family:"Barlow Condensed",sans-serif;font-size:15px;font-weight:600;color:var(--muted-2)}
.ovt .tm{color:var(--paper);min-width:74px;max-width:132px;overflow:hidden;text-overflow:ellipsis}
.ovt .vs{color:var(--muted-2);font-family:"Barlow Condensed",sans-serif;font-size:11px;
  letter-spacing:.08em;width:26px}
.ovt .vs.hasc{width:auto;min-width:56px;padding:5px 6px;line-height:1.15}
.ovt .sc2{display:block;font-family:"Barlow Condensed",sans-serif;font-size:15px;font-weight:700;color:var(--gold-hi)}
.ovt .vs.ip .sc2{color:var(--live)}
.ovt .sd2{display:block;margin-top:3px;padding-top:3px;border-top:1px solid var(--line-soft);
  font-family:"Barlow Condensed",sans-serif;font-size:11px;font-weight:500;color:var(--muted)}
.ovt .sd2 i{display:block;font-style:normal;line-height:1.35;white-space:nowrap}
.ovt .ipt{display:block;margin-top:2px;font-size:9px;letter-spacing:.14em;color:var(--live)}
.ovt .w2{color:var(--gold-hi);font-weight:700}
.ovt .g2{color:var(--muted-2);font-size:11px}
.ovt tr.live2 td{background:rgba(226,87,76,.1)}

/* ---------- 抽签 ---------- */
.board{display:grid;grid-template-columns:1fr;gap:14px;margin-bottom:18px}
@media(min-width:680px){.board{grid-template-columns:1fr 1fr}}
.bgrp{border:1px solid var(--line-soft);border-radius:var(--rl);background:var(--ink-1);overflow:hidden}
.bgrp h3{background:var(--ink-3);padding:8px 13px;font-size:11.5px;letter-spacing:.22em;
  color:var(--gold-dim);display:flex;align-items:center;gap:8px}
.bgrp h3 span{margin-left:auto;font-family:"Barlow Condensed",sans-serif;font-size:13px;color:var(--muted-2)}
.bslot{display:flex;align-items:center;gap:10px;padding:10px 13px;border-top:1px solid var(--line-soft);
  transition:background .6s}
.bslot .sc3{font-family:"Barlow Condensed",sans-serif;font-size:13px;font-weight:700;
  min-width:28px;height:23px;display:inline-flex;align-items:center;justify-content:center;
  border:1px solid var(--line);border-radius:3px;color:var(--muted-2);flex:none}
.bslot.taken .sc3{border-color:var(--gold-deep);color:var(--gold)}
.bslot .nm3{font-size:14.5px;color:var(--muted-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bslot.taken .nm3{color:var(--paper);font-weight:500}
.bslot .rg3{margin-left:auto;font-size:10.5px;color:var(--muted-2);flex:none;
  border:1px solid var(--line-soft);border-radius:2px;padding:1px 6px}
.bslot.fresh{background:linear-gradient(90deg,rgba(224,178,79,.28),transparent 78%)}

.gates{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:440px){.gates{grid-template-columns:1fr 1fr}}
@media(min-width:900px){.gates{grid-template-columns:repeat(4,1fr)}}
.gate2{border:1px solid var(--line-soft);border-radius:var(--rl);background:var(--ink-1);
  padding:16px 15px;text-align:left;cursor:pointer;transition:border-color .2s,transform .2s;width:100%}
.gate2:hover:not(:disabled){border-color:var(--gold-deep);transform:translateY(-2px)}
.gate2:disabled{opacity:.42;cursor:not-allowed}
.gate2 .gl{font-family:"Noto Serif SC",serif;font-size:18px;font-weight:700;color:var(--gold-hi)}
.gate2 .gq{font-size:11.5px;color:var(--muted-2);margin-top:5px;line-height:1.6}
.gate2 .gn{margin-top:9px;font-family:"Barlow Condensed",sans-serif;font-size:12px;
  letter-spacing:.14em;color:var(--gold)}

.drawbox{border:1px solid var(--gold-deep);border-radius:var(--rl);padding:18px;
  background:linear-gradient(155deg,rgba(224,178,79,.13),var(--ink-1))}
.drawbox h4{font-family:"Noto Serif SC",serif;font-size:17px;color:var(--gold-hi)}
.drawbox p{font-size:12.5px;color:var(--muted);margin-top:6px}
.roller{margin:18px 0 6px;text-align:center;border:1px solid var(--line);border-radius:var(--rl);
  background:var(--ink);padding:26px 14px;position:relative;overflow:hidden}
.roller .rv{font-family:"Barlow Condensed",sans-serif;font-size:clamp(48px,17vw,74px);font-weight:700;
  line-height:1;letter-spacing:.04em;color:var(--gold-hi);font-variant-numeric:tabular-nums}
.roller.spin .rv{opacity:.55;filter:blur(.6px)}
.roller.done{border-color:var(--gold);box-shadow:0 0 30px rgba(224,178,79,.28) inset}
.roller.done .rv{background:linear-gradient(96deg,var(--gold-hi),var(--gold) 58%,var(--gold-deep));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  animation:pop .55s cubic-bezier(.2,1.5,.4,1)}
@keyframes pop{from{transform:scale(.72);opacity:0}to{transform:scale(1);opacity:1}}
.roller .rl2{font-size:11px;letter-spacing:.26em;color:var(--gold-dim);margin-top:10px}
.roller .rteam{font-family:"Noto Serif SC",serif;font-size:18px;font-weight:700;
  color:var(--paper);margin-top:8px}

/* ---------- standings ---------- */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line-soft);border-radius:var(--rl);background:var(--ink-1)}
table.st{width:100%;min-width:520px;font-size:13.5px}
table.st th,table.st td{padding:9px 10px;text-align:center;border-bottom:1px solid var(--line-soft);
  font-variant-numeric:tabular-nums;white-space:nowrap}
table.st th{font-size:10.5px;letter-spacing:.12em;color:var(--muted-2);font-weight:500;
  background:var(--ink-2);position:sticky;top:0}
table.st td:nth-child(2){text-align:left;font-weight:500}
table.st tr:last-child td{border-bottom:0}
table.st .rk{font-family:"Barlow Condensed",sans-serif;font-size:17px;font-weight:700;color:var(--muted-2)}
table.st tr.top .rk{color:var(--gold-hi)}
table.st tr.top td:nth-child(2){color:var(--gold-hi)}
table.st tr.qual{box-shadow:inset 2px 0 0 var(--gold-deep)}
.mx{width:100%;min-width:760px;font-size:12px}
.mx th,.mx td{border:1px solid var(--line-soft);padding:6px 5px;text-align:center;
  font-variant-numeric:tabular-nums;vertical-align:middle}
.mx th{background:var(--ink-2);color:var(--muted-2);font-weight:500;font-size:11px}
.mx td.self{background:var(--ink-3)}
.mx td.res{font-family:"Barlow Condensed",sans-serif;font-size:15px;font-weight:600;line-height:1.15;
  min-width:58px;padding:5px 4px}
.mx td.res small{display:block;margin-top:3px;padding-top:3px;
  border-top:1px solid var(--line-soft);font-family:"Barlow Condensed",sans-serif;
  font-size:11.5px;color:var(--muted);font-weight:500;letter-spacing:.2px}
.mx td.res small i{display:block;font-style:normal;line-height:1.35;white-space:nowrap}
.mx td.res small i.l{color:var(--muted-2)}
.mx td.win{color:var(--gold-hi)}
.mx td.res.ip{color:var(--live);background:rgba(226,87,76,.07)}
.mx td.res .ipt2{display:block;margin-top:2px;font-family:"Noto Sans SC",sans-serif;
  font-size:8.5px;letter-spacing:.14em;color:var(--live);font-weight:400}

/* ---------- bracket（球赛转播风格） ---------- */
.scroller{overflow-x:auto;overflow-y:visible;-webkit-overflow-scrolling:touch;
  scrollbar-width:none;padding:30px 0 6px;margin:0 -16px;scroll-snap-type:x proximity}
.scroller::-webkit-scrollbar{display:none}
.swipe{display:flex;align-items:center;gap:7px;font-size:11px;letter-spacing:.12em;
  color:var(--muted-2);margin:6px 0 2px;position:relative;z-index:2}
.swipe i{flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent);font-style:normal}
@media(min-width:900px){.swipe{display:none}}

.tree{display:flex;align-items:stretch;min-width:706px;padding:0 16px}
.rnd{flex:1;display:flex;flex-direction:column;min-width:0;position:relative;padding:0 19px;
  scroll-snap-align:center}
.rnd>h3{position:absolute;top:-24px;left:19px;right:19px;margin:0;
  font-family:"Barlow Condensed",sans-serif;font-size:12px;font-weight:700;letter-spacing:.22em;
  color:var(--gold-dim);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rnd>h3 b{color:var(--gold-hi);font-family:"Noto Sans SC",sans-serif;font-weight:700;
  letter-spacing:.08em;margin-right:7px}
.rnd .stack{flex:1;display:flex;flex-direction:column;justify-content:space-around;position:relative}
.pair{flex:1;display:flex;flex-direction:column;justify-content:space-around;position:relative}
.r1 .bm::after,.r2 .bm::after{content:"";position:absolute;right:-19px;top:50%;width:19px;height:1px;
  background:var(--line);transition:background .5s,box-shadow .5s}
.r1 .bm.adv::after,.r2 .bm.adv::after{background:var(--gold);box-shadow:0 0 8px rgba(224,178,79,.6)}
.pair::after{content:"";position:absolute;right:-19px;top:25%;bottom:25%;width:1px;background:var(--line)}
.pair.solved::after{background:linear-gradient(180deg,var(--gold-deep),var(--gold),var(--gold-deep));
  box-shadow:0 0 8px rgba(224,178,79,.35)}
.r2 .pair::before,.r3 .pair::before{content:"";position:absolute;left:-19px;top:50%;width:19px;height:1px;
  background:var(--line)}
.r2 .pair.fed::before,.r3 .pair.fed::before{background:var(--gold);box-shadow:0 0 8px rgba(224,178,79,.55)}
.r3 .stack{justify-content:center;gap:14px}

.bm{background:linear-gradient(158deg,var(--ink-2),var(--ink-1));
  border:1px solid var(--line-soft);border-radius:7px;padding:0;overflow:hidden;
  position:relative;transition:border-color .25s,box-shadow .25s,transform .2s}
.bm:hover{border-color:var(--gold-deep);transform:translateY(-1px)}
.bm.gold{border-color:var(--gold-deep)}
.bm .bt{display:flex;align-items:center;gap:7px;font-family:"Barlow Condensed",sans-serif;
  font-size:11px;letter-spacing:.12em;color:var(--muted-2);
  background:rgba(36,30,20,.75);padding:4px 9px;border-bottom:1px solid var(--line-soft)}
.bm.gold .bt{background:linear-gradient(90deg,rgba(224,178,79,.24),rgba(36,30,20,.7));color:var(--gold-hi)}
.bm .bt .rt{margin-left:auto;color:inherit;opacity:.85}
.bm .bt .onairdot{width:6px;height:6px;border-radius:50%;background:var(--live);
  animation:pulse 1.4s infinite;flex:none}
.bs{display:flex;align-items:center;gap:9px;padding:8px 10px;position:relative}
.bs+.bs{border-top:1px solid rgba(58,47,29,.55)}
.bs .sd{font-family:"Barlow Condensed",sans-serif;font-size:11.5px;font-weight:700;
  min-width:24px;height:19px;display:inline-flex;align-items:center;justify-content:center;
  border:1px solid var(--line);border-radius:3px;color:var(--muted-2);flex:none;letter-spacing:.02em}
.bs .nm{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.bs .sc{margin-left:auto;font-family:"Barlow Condensed",sans-serif;font-weight:700;
  font-size:20px;color:var(--muted-2);flex:none;font-variant-numeric:tabular-nums;line-height:1}
.bs.w{background:linear-gradient(90deg,rgba(224,178,79,.13),transparent 72%)}
.bs.w::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--gold);
  box-shadow:0 0 10px rgba(224,178,79,.8)}
.bs.w .nm{color:var(--gold-hi);font-weight:700}
.bs.w .sc{color:var(--gold-hi)}
.bs.w .sd{border-color:var(--gold-deep);color:var(--gold)}
.bm .setline{font-family:"Barlow Condensed",sans-serif;font-size:11px;letter-spacing:.1em;
  color:var(--muted-2);padding:4px 10px 6px;border-top:1px solid rgba(58,47,29,.4);
  font-variant-numeric:tabular-nums}

/* 冠军牌 */
.champ{border:1px solid var(--gold-deep);border-radius:var(--rl);padding:20px 16px;text-align:center;
  position:relative;overflow:hidden;
  background:linear-gradient(155deg,rgba(224,178,79,.22),rgba(140,100,33,.08) 58%,var(--ink-1))}
.champ::after{content:"";position:absolute;top:0;left:-60%;width:45%;height:100%;
  background:linear-gradient(100deg,transparent,rgba(247,227,166,.25),transparent);
  animation:sweep 4.6s ease-in-out infinite}
@keyframes sweep{0%{left:-60%}55%,100%{left:130%}}
.champ .cup{font-size:28px;line-height:1}
.champ .cl{font-family:"Barlow Condensed",sans-serif;font-size:11px;letter-spacing:.34em;
  color:var(--gold-dim);margin-top:8px}
.champ .cn{font-family:"Noto Serif SC",serif;font-size:22px;font-weight:900;margin-top:5px;
  background:linear-gradient(96deg,var(--gold-hi),var(--gold) 60%,var(--gold-deep));
  -webkit-background-clip:text;background-clip:text;color:transparent}
.champ .cn.tbd{background:none;color:var(--muted-2);font-size:16px;font-weight:700}
.champ .sub{font-size:11.5px;color:var(--muted-2);margin-top:9px}
/* 名次赛列表 */
.rank-list{display:grid;grid-template-columns:1fr;gap:10px;margin-top:10px}
@media(min-width:620px){.rank-list{grid-template-columns:1fr 1fr}}
@media(min-width:980px){.rank-list{grid-template-columns:repeat(4,1fr)}}

/* ---------- teams ---------- */
.tg{display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:1px;
  background:var(--line-soft);border:1px solid var(--line-soft);border-radius:var(--rl);overflow:hidden}
.tc{background:var(--ink-1);padding:14px}
.tc .code{font-family:"Barlow Condensed",sans-serif;font-size:12px;letter-spacing:.16em;color:var(--gold-deep)}
.tc h4{font-size:16px;font-weight:700;margin-top:2px;color:var(--paper)}
.tc .rg{font-size:11.5px;color:var(--muted-2);margin-top:2px}
.tc p{font-size:12.5px;color:var(--muted);margin-top:8px;white-space:pre-wrap}
.tc details{margin-top:10px}
.tc summary{font-size:12px;color:var(--gold-dim);cursor:pointer;list-style:none;
  border-top:1px solid var(--line-soft);padding-top:8px}
.tc summary::-webkit-details-marker{display:none}
.tc summary::after{content:" ▾"}
.tc details[open] summary::after{content:" ▴"}
.roster{margin-top:8px;font-size:12.5px}
.roster div{display:flex;gap:8px;padding:3px 0;border-bottom:1px solid var(--line-soft)}
.roster div:last-child{border:0}
.roster .n{font-family:"Barlow Condensed",sans-serif;width:26px;color:var(--gold-dim);
  font-variant-numeric:tabular-nums;font-size:14px}
.roster .p{margin-left:auto;color:var(--muted-2);font-size:11.5px}
.cap{color:var(--gold);font-size:10px;border:1px solid var(--gold-deep);padding:0 4px;border-radius:2px}

/* ---------- live streams ---------- */
.lv{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:12px}
.srch{margin-top:10px;padding-top:10px;border-top:1px solid var(--line-soft)}
.srch span{font-size:12px;color:var(--muted-2)}
.srch b{display:block;margin:5px 0 9px;font-size:16px;font-weight:700;color:var(--gold-hi);
  letter-spacing:.02em;word-break:break-all;-webkit-user-select:all;user-select:all}
.lvc{position:relative;display:block;background:var(--ink-1);border:1px solid var(--line-soft);
  border-radius:var(--rl);padding:15px 16px;overflow:hidden;transition:border-color .2s,transform .2s}
a.lvc:hover{border-color:var(--gold-deep);transform:translateY(-2px)}
.lvc::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--plat,var(--gold-deep))}
.lvc .pl{display:flex;align-items:center;gap:7px;font-size:11px;letter-spacing:.14em;color:var(--plat,var(--gold-dim))}
.lvc .pl b{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;
  border-radius:5px;background:var(--plat,var(--gold-deep));color:#12100B;font-size:11px;font-weight:700;
  letter-spacing:0;flex:none}
.lvc h4{font-size:15.5px;font-weight:700;color:var(--paper);margin-top:8px}
.lvc p{font-size:12.5px;color:var(--muted);margin-top:5px;white-space:pre-wrap}
.lvc .go{margin-top:10px;font-size:11.5px;letter-spacing:.14em;color:var(--gold)}
.onair{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;letter-spacing:.12em;
  color:#F2AAA3;background:rgba(226,87,76,.15);border:1px solid var(--live);
  padding:1px 7px;border-radius:2px;margin-left:auto}
.onair i{width:6px;height:6px;border-radius:50%;background:var(--live);animation:pulse 1.4s infinite;font-style:normal}

/* ---------- cards / links ---------- */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{background:var(--ink-1);border:1px solid var(--line-soft);border-radius:var(--rl);
  padding:15px;display:block;transition:border-color .2s,transform .2s}
a.card:hover{border-color:var(--gold-deep);transform:translateY(-2px)}
.card h4{font-size:15px;font-weight:700;color:var(--paper)}
.card p{font-size:12.5px;color:var(--muted);margin-top:5px;white-space:pre-wrap}
.card .go{margin-top:9px;font-size:11.5px;letter-spacing:.14em;color:var(--gold)}
.empty{color:var(--muted-2);font-size:13px;padding:22px;text-align:center;
  border:1px dashed var(--line);border-radius:var(--rl)}

/* awards */
.podium{display:grid;grid-template-columns:1fr;gap:1px;background:var(--line-soft);
  border:1px solid var(--line-soft);border-radius:var(--rl);overflow:hidden}
@media(min-width:640px){.podium{grid-template-columns:repeat(3,1fr)}}
.pd{background:var(--ink-1);padding:18px 16px;text-align:center}
.pd .pl{font-size:11px;letter-spacing:.24em;color:var(--muted-2)}
.pd .pn{font-family:"Noto Serif SC",serif;font-size:20px;font-weight:700;margin-top:6px;color:var(--paper)}
.pd .pp{font-size:12px;color:var(--muted-2);margin-top:4px}
.pd.g{background:linear-gradient(165deg,rgba(224,178,79,.14),var(--ink-1))}
.pd.g .pl{color:var(--gold)}
.pd.g .pn{background:linear-gradient(96deg,var(--gold-hi),var(--gold));
  -webkit-background-clip:text;background-clip:text;color:transparent}
.aw{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:1px;
  background:var(--line-soft);border:1px solid var(--line-soft);border-radius:var(--rl);overflow:hidden;margin-top:12px}
.awi{background:var(--ink-1);padding:12px 14px}
.awi .l{font-size:10.5px;letter-spacing:.16em;color:var(--muted-2)}
.awi .v{font-size:15px;font-weight:700;margin-top:3px}
.awi .t{font-size:11.5px;color:var(--muted-2)}

/* ---------- 队伍清单 ---------- */
.tmlist{display:grid;grid-template-columns:1fr;background:var(--line-soft);gap:1px;
  border:1px solid var(--line-soft);border-radius:var(--rl);overflow:hidden}
@media(min-width:720px){.tmlist{grid-template-columns:1fr 1fr}}
.tmrow{display:flex;align-items:center;gap:13px;padding:15px 15px;width:100%;text-align:left;
  background:rgba(18,16,11,.88);border:0;cursor:pointer;transition:background .2s}
.tmrow:hover{background:var(--ink-3)}
.tmrow .sd2{font-family:"Barlow Condensed",sans-serif;font-size:16px;font-weight:700;
  min-width:38px;height:32px;display:inline-flex;align-items:center;justify-content:center;
  border:1px solid var(--gold-deep);border-radius:4px;color:var(--gold);flex:none;
  letter-spacing:.03em;background:rgba(224,178,79,.07)}
.tmrow .mid{min-width:0;flex:1}
.tmrow .nm4{display:block;font-family:"Noto Serif SC",serif;font-size:16.5px;font-weight:700;
  color:var(--paper);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.35}
.tmrow .sub4{display:block;font-size:11.5px;color:var(--muted-2);margin-top:2px;letter-spacing:.06em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tmrow .go4{flex:none;font-size:11px;letter-spacing:.12em;color:var(--gold-dim);
  display:flex;align-items:center;gap:5px}
.tmrow .go4 b{font-family:"Barlow Condensed",sans-serif;font-size:17px;font-weight:700;line-height:1}

/* ---------- 全屏名单 ---------- */
.rv{position:fixed;inset:0;z-index:80;background:var(--ink);display:flex;
  flex-direction:column;-webkit-overflow-scrolling:touch}
.rv .rvtop{display:flex;align-items:center;gap:11px;padding:12px 15px;flex:none;
  border-bottom:1px solid var(--line-soft);background:rgba(11,9,6,.96)}
.rv .rvtop .sd2{font-family:"Barlow Condensed",sans-serif;font-size:15px;font-weight:700;
  min-width:34px;height:28px;display:inline-flex;align-items:center;justify-content:center;
  border:1px solid var(--gold-deep);border-radius:4px;color:var(--gold);flex:none}
.rv .rvtop h4{font-family:"Noto Serif SC",serif;font-size:16px;font-weight:700;
  color:var(--gold-hi);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rv .rvx{border:1px solid var(--line);background:transparent;color:var(--muted);
  border-radius:var(--r);padding:5px 11px;font-size:13px;cursor:pointer;flex:none}
.rv .rvx:hover{border-color:var(--gold-deep);color:var(--gold)}
.rv .rvbody{flex:1;overflow:auto;padding:14px 12px 4px;-webkit-overflow-scrolling:touch}
.rv .rvbody img{width:100%;max-width:620px;margin:0 auto;display:block;border-radius:8px;
  border:1px solid var(--line-soft)}
.rv .rvhint{text-align:center;font-size:11px;color:var(--muted-2);padding:9px 0 2px}
.rv .rvnav{flex:none;display:flex;align-items:center;gap:10px;padding:10px 15px;
  border-top:1px solid var(--line-soft);background:rgba(11,9,6,.96)}
.rv .rvnav button{flex:1;border:1px solid var(--line);background:transparent;color:var(--muted);
  border-radius:var(--r);padding:11px 8px;font-size:13.5px;cursor:pointer}
.rv .rvnav button:hover:not(:disabled){border-color:var(--gold-deep);color:var(--gold)}
.rv .rvnav button:disabled{opacity:.35;cursor:not-allowed}
.rv .rvcount{flex:none;font-family:"Barlow Condensed",sans-serif;font-size:14px;
  color:var(--muted-2);letter-spacing:.08em;min-width:52px;text-align:center}
.nolist{font-size:12px;color:var(--muted-2);margin-top:10px}

/* notes */
.note{border:1px solid var(--line-soft);border-radius:var(--rl);background:var(--ink-1);
  padding:15px 16px;margin-bottom:10px}
.note h4{font-size:14.5px;font-weight:700;color:var(--gold-hi)}
.way{border:1px solid var(--line-soft);border-radius:var(--rl);background:var(--ink-1);
  padding:14px 15px;margin-bottom:11px}
.way .wh{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.way .wh i{font-style:normal;flex:none;font-size:11.5px;letter-spacing:.14em;color:var(--gold);
  border:1px solid var(--gold-deep);border-radius:5px;padding:4px 9px}
.way .wh b{font-size:14.5px;color:var(--gold-hi);font-weight:700}
.way .wp{font-size:13px;color:var(--muted);line-height:1.75}
.way ol.steps{margin:8px 0 0;padding:0;list-style:none;counter-reset:st}
.way ol.steps li{counter-increment:st;position:relative;padding:8px 0 8px 30px;
  font-size:13.5px;color:var(--muted);line-height:1.7}
.way ol.steps li+li{border-top:1px solid var(--line-soft)}
.way ol.steps li:before{content:counter(st);position:absolute;left:0;top:8px;
  width:20px;height:20px;border-radius:50%;background:var(--ink-3);border:1px solid var(--gold-deep);
  color:var(--gold);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.way ol.steps li b{color:var(--paper);font-weight:700}
.routeimg{display:block;width:100%;margin-top:12px;border-radius:8px;border:1px solid var(--line-soft)}
.myhint{margin:2px 0 14px;padding:10px 12px;border:1px solid var(--gold-deep);border-radius:var(--rl);
  background:rgba(224,178,79,.07);font-size:12.5px;color:var(--muted);line-height:1.7}
.myhint b{color:var(--gold-hi);font-weight:700}
.chip.duty{border-color:var(--gold-deep);color:var(--gold);background:rgba(224,178,79,.1)}
.way .sub{margin-top:12px;padding-top:12px;border-top:1px solid var(--line-soft)}
.way .sub:first-of-type{margin-top:4px}
.way .sub h5{font-size:13.5px;font-weight:700;color:var(--paper);margin-bottom:6px}
table.trip{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:12px;table-layout:fixed}
table.trip th{background:var(--ink-3);color:var(--gold-dim);font-weight:500;font-size:10.5px;
  letter-spacing:.06em;padding:8px 7px;text-align:left;border:1px solid var(--line-soft)}
table.trip th:nth-child(1),table.trip td:nth-child(1){width:26%}
table.trip th:nth-child(3),table.trip td:nth-child(3){width:24%}
table.trip td{padding:9px 7px;border:1px solid var(--line-soft);color:var(--muted);line-height:1.55;
  vertical-align:middle;word-break:break-word}
table.trip td:first-child{color:var(--paper)}
table.trip td:last-child{color:var(--gold-dim);font-variant-numeric:tabular-nums}
table.trip td b{color:var(--gold-hi);font-weight:700}
table.trip tr.hi td{background:rgba(224,178,79,.07)}
.note p{font-size:13.5px;color:var(--muted);margin-top:6px;white-space:pre-wrap}

/* ---------- admin ---------- */
.adm{position:fixed;inset:0;z-index:60;background:rgba(6,5,3,.97);overflow-y:auto;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.adm-in{width:var(--w);margin:0 auto;padding:18px 0 100px}
.adm-h{display:flex;align-items:center;gap:10px;padding:8px 0 14px;position:sticky;top:0;
  background:rgba(6,5,3,.97);z-index:2;border-bottom:1px solid var(--line-soft);margin-bottom:14px}
.adm-h h2{font-family:"Noto Serif SC",serif;font-size:17px;color:var(--gold-hi);flex:1}
.btn{border:1px solid var(--gold-deep);background:transparent;color:var(--gold);
  border-radius:var(--r);padding:8px 14px;font-size:13px;cursor:pointer;font-weight:500;
  transition:background .18s,color .18s}
.btn:hover{background:rgba(224,178,79,.12)}
.btn.pri{background:var(--gold);border-color:var(--gold);color:var(--ink);font-weight:700}
.btn.pri:hover{background:var(--gold-hi)}
.btn.gh{border-color:var(--line);color:var(--muted)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.fld{margin-bottom:11px}
.fld label{display:block;font-size:11px;letter-spacing:.13em;color:var(--muted-2);margin-bottom:4px}
.fld input,.fld textarea,.fld select{width:100%;background:var(--ink-2);border:1px solid var(--line);
  border-radius:var(--r);padding:9px 10px;font-size:14px}
.fld textarea{min-height:76px;resize:vertical;line-height:1.55}
.fld input:focus,.fld textarea:focus,.fld select:focus{border-color:var(--gold-deep);outline:none}
.row{display:grid;gap:10px;grid-template-columns:1fr 1fr}
.box{border:1px solid var(--line-soft);border-radius:var(--rl);background:var(--ink-1);
  padding:14px;margin-bottom:12px}
.box>h4{font-size:13.5px;color:var(--gold-hi);margin-bottom:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.setrow{display:grid;grid-template-columns:44px 1fr 12px 1fr;gap:7px;align-items:center;margin-bottom:7px}
.setrow span{font-size:11px;color:var(--muted-2);text-align:center}
.setrow input{width:100%;background:var(--ink-2);border:1px solid var(--line);border-radius:var(--r);
  padding:8px;text-align:center;font-family:"Barlow Condensed",sans-serif;font-size:18px;font-variant-numeric:tabular-nums}
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:61;background:rgba(11,9,6,.97);
  border-top:1px solid var(--line);padding:11px 0}
.savebar-in{width:var(--w);margin:0 auto;display:flex;gap:10px;align-items:center}
.savebar .st{flex:1;font-size:12px;color:var(--muted-2)}
.gate{max-width:340px;margin:16vh auto 0;text-align:center}
.gate .seal{width:44px;height:44px;margin:0 auto 14px}
.gate h3{font-family:"Noto Serif SC",serif;font-size:18px;color:var(--gold-hi);margin-bottom:14px}
.pill{display:inline-flex;gap:5px;align-items:center;font-size:11px;color:var(--muted-2)}
.foot{width:var(--w);margin:0 auto;padding:26px 0 40px;border-top:1px solid var(--line-soft);
  font-size:11.5px;color:var(--muted-2);display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.toast{position:fixed;left:50%;bottom:82px;transform:translateX(-50%);z-index:70;
  background:var(--ink-3);border:1px solid var(--gold-deep);color:var(--gold-hi);
  padding:10px 18px;border-radius:var(--rl);font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.6)}
/* ============================================================
   手机端适配（<=560px）：居中、加大字号、表格改卡片
   ============================================================ */
@media(max-width:560px){
  body{font-size:15.5px}

  /* 顶栏：小屏藏掉英文副标，给按钮腾地方 */
  .bar-in{height:52px;gap:8px}
  .brand span{display:none}
  .brand b{font-size:16.5px}
  .bar-act .mini{padding:7px 9px;font-size:12px}

  /* 导航：右侧渐隐，提示可以左右滑 */
  .nav::after{content:"";position:absolute;right:0;top:0;bottom:0;width:26px;pointer-events:none;
    background:linear-gradient(90deg,transparent,rgba(11,9,6,.94))}
  .tab{padding:12px 12px 10px;font-size:14.5px}

  /* 区块标题居中 */
  .sh{display:block;text-align:center;margin:30px 0 14px}
  .sh:first-child{margin-top:6px}
  .sh h2{display:block;font-size:18px}
  .sh em{display:block;margin-top:3px;font-size:10.5px}
  .sh .rule{display:block;width:56px;height:2px;margin:9px auto 0;
    background:linear-gradient(90deg,transparent,var(--gold),transparent)}

  /* 首页头图整体居中 */
  .hero{text-align:center;padding-top:30px;padding-bottom:22px}
  .hero .helm::after{background:linear-gradient(180deg,rgba(11,9,6,.82),rgba(11,9,6,.55) 40%,rgba(11,9,6,.86))}
  .hero .eyeb{letter-spacing:.22em;font-size:10.5px}
  .hero .yr{margin-top:8px}
  .hero .yr em{font-size:.24em;margin-left:8px}
  .hero h1{font-size:clamp(26px,8.4vw,36px);margin-top:8px}
  .hero .slogan{letter-spacing:.24em;font-size:13px;margin-top:14px}
  .hero .en{font-size:10px;letter-spacing:.12em;margin-top:5px;
    padding:0 4px;line-height:1.5}
  .cd{justify-content:center;text-align:center;padding:16px 14px}
  .cd>div{width:100%}
  .cd .cdv{font-size:clamp(32px,10vw,42px);margin-top:5px}
  .facts{text-align:center}
  .fact{padding:13px 10px}
  .fact dd{font-size:13px}

  /* 交通速查表：小屏改成一条一张卡 */
  table.trip{display:block;border:1px solid var(--line-soft);border-radius:var(--rl);
    overflow:hidden;font-size:13px;margin-bottom:14px}
  table.trip thead{display:none}
  table.trip tbody{display:block}
  table.trip tr{display:block;padding:11px 13px;background:rgba(18,16,11,.72)}
  table.trip tr+tr{border-top:1px solid var(--line-soft)}
  table.trip td{display:block;width:auto !important;border:0;padding:0;line-height:1.6}
  table.trip td:first-child{color:var(--gold-hi);font-weight:700;font-size:14px;margin-bottom:2px}
  table.trip td:nth-child(2){color:var(--muted);font-size:13px}
  table.trip td:nth-child(3){color:var(--gold-dim);font-size:12px;margin-top:4px;
    letter-spacing:.04em}

  /* 路线卡片 */
  .way{padding:15px 14px}
  .way .wh b{font-size:15px}
  .way .wp{font-size:13.5px}
  .way ol.steps li{font-size:13.5px;padding-left:28px}
  .way .sub h5{font-size:14px}
  .routeimg{cursor:zoom-in}
  .zoomtip{display:block;text-align:center;font-size:11.5px;color:var(--gold-dim);
    letter-spacing:.06em;margin-top:7px}

  /* 比赛卡片 */
  .m .who b{font-size:15.5px}
  .pairs{gap:10px}

  /* 队伍清单：简介允许两行，不要半句就截断 */
  .tmrow{padding:14px 13px;gap:11px}
  .tmrow .sub4{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;
    -webkit-box-orient:vertical;line-height:1.55;font-size:12px}
  .tmrow .nm4{font-size:16px}

  /* 积分榜：小屏藏掉「分 得/失」「Z值」，让表格正好放得下 */
  table.st{min-width:0;width:100%;font-size:13px}
  table.st th:nth-child(8),table.st td:nth-child(8),
  table.st th:nth-child(9),table.st td:nth-child(9){display:none}
  table.st th,table.st td{padding-left:5px;padding-right:5px}

  /* 榜单/奖项 */
  .aw .val,.awrow .val{font-size:16px}
}

@media(max-width:380px){
  .tab{padding:12px 10px;font-size:14px}
  .hero h1{font-size:25px}
  .bar-act .mini{padding:6px 7px;font-size:11.5px}
}

.onlymob{display:none}
@media(max-width:560px){.onlymob{display:inline}}

/* 图片放大浮层 */
.zoom{position:fixed;inset:0;z-index:120;background:rgba(6,5,3,.96);
  display:flex;align-items:center;justify-content:center;overflow:auto;
  -webkit-overflow-scrolling:touch;padding:0}
.zoom img{max-width:none;width:auto;min-width:100%;display:block;flex:none;margin:auto}
.zoom .zx{position:fixed;top:14px;right:14px;z-index:2;border:1px solid var(--line);
  background:rgba(11,9,6,.9);color:var(--paper);border-radius:var(--r);
  padding:9px 13px;font-size:13px;cursor:pointer}

</style>

</head>

/* ---------- helpers ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function el(id){return document.getElementById(id);}
function toast(msg){var t=document.createElement('div');t.className='toast';t.textContent=msg;
  document.body.appendChild(t);setTimeout(function(){t.remove();},2600);}
function clone(o){return JSON.parse(JSON.stringify(o));}

/* ---------- team / slot resolution ---------- */
function teamByCode(c){for(var i=0;i<D.teams.length;i++){if(D.teams[i].code===c)return D.teams[i];}return null;}
function teamName(c){var t=teamByCode(c);return t?(t.name||c):c;}
function matchByNo(n){for(var i=0;i<D.matches.length;i++){if(D.matches[i].no===n)return D.matches[i];}return null;}

function setsWon(m){var a=0,b=0;(m.sets||[]).forEach(function(s){
  if(s&&s.length===2&&(s[0]!==''&&s[0]!=null)&&(s[1]!==''&&s[1]!=null)){
    var x=+s[0],y=+s[1];if(x>y)a++;else if(y>x)b++;}});return [a,b];}
function isFinal(m){if(m.status==='final')return true;var w=setsWon(m);return w[0]>=2||w[1]>=2;}
function isLive(m){return m.status==='live'&&!isFinal(m);}
/* 已填过任意一局比分 —— 只要填了就立刻对外显示 */
function setList(m){return (m.sets||[]).filter(function(s){
  return s&&s[0]!==''&&s[0]!=null&&s[1]!==''&&s[1]!=null;});}
function hasScore(m){return setList(m).length>0;}
function showScore(m){return hasScore(m)||isLive(m)||isFinal(m);}
/* 这一场是不是由 code 这支队执裁 */
function isRefOf(m,code){
  if(!m.ref||!code||code==='all')return false;
  return String(m.ref).replace('主办方+','').split('/')
    .map(function(x){return x.trim();}).indexOf(code)>=0;
}
function winnerCode(m){ if(!isFinal(m))return null; var w=setsWon(m);
  var a=resolve(m.a),b=resolve(m.b); if(!a||!b)return null; return w[0]>w[1]?a:b;}
function loserCode(m){ if(!isFinal(m))return null; var w=setsWon(m);
  var a=resolve(m.a),b=resolve(m.b); if(!a||!b)return null; return w[0]>w[1]?b:a;}

/* resolve a slot ref to a team code, or null when not决出 */
function resolve(ref){
  if(!ref)return null;
  if(ref.t==='team')return ref.code;
  if(ref.t==='rank'){var st=standings(ref.g); if(!st.complete)return null;
    return st.rows[ref.r-1]?st.rows[ref.r-1].code:null;}
  if(ref.t==='win'){var m=matchByNo(ref.m);return m?winnerCode(m):null;}
  if(ref.t==='lose'){var m2=matchByNo(ref.m);return m2?loserCode(m2):null;}
  return null;
}
function slotLabel(ref){
  var c=resolve(ref); if(c)return teamName(c);
  if(!ref)return '待定';
  if(ref.t==='team')return teamName(ref.code);
  if(ref.t==='rank')return ref.g+'组第'+ref.r;
  if(ref.t==='win')return '第'+ref.m+'场胜方';
  if(ref.t==='lose')return '第'+ref.m+'场负方';
  return '待定';
}

/* ---------- standings ---------- */
var _stCache={};
function standings(g){
  if(_stCache[g])return _stCache[g];
  var teams=D.teams.filter(function(t){return t.group===g;});
  var map={};teams.forEach(function(t){map[t.code]={code:t.code,name:t.name||t.code,w:0,l:0,pts:0,
    sw:0,sl:0,pf:0,pa:0,played:0};});
  var total=0,done=0;
  D.matches.forEach(function(m){
    if(m.stage!=='小组赛'||m.group!==g)return; total++;
    var a=resolve(m.a),b=resolve(m.b); if(!a||!b||!map[a]||!map[b])return;
    if(m.status==='void'){done++;return;}
    if(!isFinal(m))return; done++;
    var sa=0,sb=0,pa=0,pb=0;
    (m.sets||[]).forEach(function(s){
      if(!s||s[0]===''||s[0]==null||s[1]===''||s[1]==null)return;
      var x=+s[0],y=+s[1];pa+=x;pb+=y;if(x>y)sa++;else if(y>x)sb++;});
    var A=map[a],B=map[b];
    A.played++;B.played++;A.sw+=sa;A.sl+=sb;B.sw+=sb;B.sl+=sa;
    A.pf+=pa;A.pa+=pb;B.pf+=pb;B.pa+=pa;
    if(sa>sb){A.w++;B.l++;A.pts+= (sb===0?3:2); B.pts+= (sb===0?0:1);}
    else if(sb>sa){B.w++;A.l++;B.pts+= (sa===0?3:2); A.pts+= (sa===0?0:1);}
  });
  var rows=Object.keys(map).map(function(k){var r=map[k];
    r.C = r.sl>0 ? r.sw/r.sl : (r.sw>0?999:0);
    r.Z = r.pa>0 ? r.pf/r.pa : (r.pf>0?999:0);
    r.Cs = r.sl>0 ? (r.sw/r.sl).toFixed(3) : (r.sw>0?'∞':'—');
    r.Zs = r.pa>0 ? (r.pf/r.pa).toFixed(3) : (r.pf>0?'∞':'—');
    return r;});
  rows.sort(function(x,y){return (y.w-x.w)||(y.pts-x.pts)||(y.C-x.C)||(y.Z-x.Z)||x.code.localeCompare(y.code);});
  rows.forEach(function(r,i){r.rank=i+1;});
  var out={rows:rows,complete:(total>0&&done===total),done:done,total:total};
  _stCache[g]=out;return out;
}
function clearCache(){_stCache={};}

/* ---------- countdown ---------- */
function cdText(){
  var s=new Date(D.meta.startISO).getTime(), e=new Date(D.meta.endISO).getTime(), n=Date.now();
  if(n<s){var d=s-n;var dd=Math.floor(d/864e5),hh=Math.floor(d%864e5/36e5),mm=Math.floor(d%36e5/6e4);
    return {l:'距离开赛',v:'<span>'+dd+'</span><small>天</small><span>'+hh+'</span><small>时</small><span>'+mm+'</span><small>分</small>'};}
  if(n<=e)return {l:'赛事进行中',v:'<span>'+D.meta.dates+'</span>'};
  return {l:'赛事已结束',v:'<span>感谢参与</span>'};
}

/* ----- match row ----- */
function matchRow(m,mark){
  var a=resolve(m.a),b=resolve(m.b),w=setsWon(m),fin=isFinal(m),lv=isLive(m);
  var ip=!fin&&(lv||hasScore(m));            /* 进行中：已填分但未打完 */
  var sh=showScore(m);
  var wa=fin&&w[0]>w[1],wb=fin&&w[1]>w[0];
  var setStr=setList(m).map(function(s){return s[0]+':'+s[1];}).join('  ');
  var h='<div class="m'+(ip?' live':(fin?' final':''))+'">';
  h+='<div class="no">'+m.no+'<em>'+esc(m.court)+'</em></div>';
  h+='<div class="who">'+
     '<div class="side'+(wa?' w':'')+'"><span class="nm">'+esc(slotLabel(m.a))+'</span>'+
       '<span class="sc">'+(sh?w[0]:'')+'</span></div>'+
     '<div class="side'+(wb?' w':'')+'"><span class="nm">'+esc(slotLabel(m.b))+'</span>'+
       '<span class="sc">'+(sh?w[1]:'')+'</span></div>'+
     (setStr?'<div class="sets">'+esc(setStr)+'</div>':'')+
     '</div>';
  h+='<div class="meta">'+
     (ip?'<span class="chip live">进行中</span>':(fin?'<span class="chip final">已结束</span>':
       '<span class="chip">'+esc(m.time)+'</span>'))+
     '<span class="chip stage">'+esc(m.stage==='小组赛'?m.group+'组':m.stage)+'</span>'+
     (mark==='duty'?'<span class="chip duty">本队裁判场次</span>':'')+
     (refLabel(m)?'<span class="ref">裁判 '+esc(refLabel(m))+'</span>':'')+
     '</div>';
  h+='</div>';
  return h;
}
/* ===================== 第二天裁判自动编排 =====================
   规则（2026 赛事）：
   1. 只排第 31 场起的交叉阶段；1–30 场裁判已写死在赛程里。
   2. 优先派「到目前为止吹得最少」的队。
   3. 同分时优先派上一时段刚打完、人还在场馆的队（同场地优先）。
   4. 昇凯 15:00 要走 —— 最晚只吹 13:00–14:00 那一批。
   5. 港澳队伍打完自己最后一场就不再排（硬性）；广东队尽量不排，实在没人才回头用。
   6. 冠军赛 / 季军赛副裁由主办方担任，队伍只出两名司线。
   7. 对阵还没产生的场次先跳过，等打完那一轮再点一次按钮。      */
var AUTOREF = {
  from: 31,
  earlyLeaveName: '昇',        /* 队名里含这个字的队 */
  earlyLeaveLastTime: '13:00-14:00',  /* 最晚只吹到这一时段 */
  hostAssist: [45, 46]         /* 这两场：主办方副裁 + 队伍司线 */
};

/* 小组赛裁判（1–30 场）：上一场刚打完的队留下来吹；
   除每天早上第一场外，不安排「下一场就要上场」的队；
   同一支队两次执裁之间至少隔两场，不会「隔一场就又吹」。数字是队伍代号的第二位。 */
var GROUPREF = {1:3, 3:2, 5:5, 7:6, 9:3, 11:2, 13:1, 15:5, 17:6, 19:4, 21:5, 23:2,
                25:1, 27:6, 29:4};
function applyGroupRefs(){
  var n = 0;
  D.matches.forEach(function(m){
    if(m.no >= AUTOREF.from) return;
    var base = (m.no % 2 === 1) ? m.no : m.no - 1;      /* 场地一的场次号 */
    var d = GROUPREF[base];
    if(!d) return;
    var code = (m.group || 'A') + d;
    if(m.ref !== code){ m.ref = code; n++; }
  });
  clearCache();
  return n;
}

function isHkMo(t){ return t && (t.region === '澳门' || t.region === '香港'); }

/* 某个位置「可能是哪几支队」——用于对阵未定时的安全判断 */
function possTeams(ref){
  if(!ref) return [];
  if(ref.t === 'team') return [ref.code];
  if(ref.t === 'rank'){
    var r = resolve(ref); if(r) return [r];
    return D.teams.filter(function(t){return t.group === ref.g;}).map(function(t){return t.code;});
  }
  if(ref.t === 'win' || ref.t === 'lose'){
    var w = resolve(ref); if(w) return [w];
    var m = matchByNo(ref.m); if(!m) return [];
    return possTeams(m.a).concat(possTeams(m.b));
  }
  return [];
}

function autoAssignRefs(){
  var d2 = D.matches.filter(function(m){return m.day === 'd2';})
                    .sort(function(x,y){return x.no - y.no;});
  var list = d2.filter(function(m){return m.no >= AUTOREF.from;});

  /* 第二天的时段顺序（含上午的小组赛收尾） */
  var slots = [], seen = {};
  d2.forEach(function(m){ if(!seen[m.time]){ seen[m.time] = true; slots.push(m.time); } });
  var slotIdx = {}; slots.forEach(function(t,i){ slotIdx[t] = i; });
  var leaveMax = slotIdx[AUTOREF.earlyLeaveLastTime];
  if(leaveMax === undefined) leaveMax = 99;

  /* 每支队在第二天「可能」出现的最后一个时段；比这更晚就算已经打完 */
  var lastSlot = {};
  d2.forEach(function(m){
    var i = slotIdx[m.time];
    possTeams(m.a).concat(possTeams(m.b)).forEach(function(c){
      if(lastSlot[c] === undefined || i > lastSlot[c]) lastSlot[c] = i;
    });
  });

  /* 每个时段谁在打球；每片场地每个时段是哪两队 */
  var playing = {}, courtPlay = {};
  d2.forEach(function(m){
    var i = slotIdx[m.time];
    playing[i] = playing[i] || {};
    courtPlay[i] = courtPlay[i] || {};
    var pair = [];
    [resolve(m.a), resolve(m.b)].forEach(function(c){ if(c){ playing[i][c] = true; pair.push(c); } });
    courtPlay[i][m.court] = pair;
  });

  /* 第一天 + 第二天上午已经吹过的场次 */
  var load = {};
  D.teams.forEach(function(t){ load[t.code] = 0; });
  D.matches.filter(function(m){return m.no < AUTOREF.from;}).forEach(function(m){
    String(m.ref || '').replace('主办方+','').split('/').forEach(function(c){
      c = c.trim(); if(load[c] !== undefined) load[c] += 1;
    });
  });
  var base = JSON.parse(JSON.stringify(load));

  var assignedAt = {};      /* 时段 -> 本时段已经派出去的队 */
  /* 第二天上午小组赛的执裁也算进来，避免刚吹完隔一场又吹 */
  d2.filter(function(m){return m.no < AUTOREF.from;}).forEach(function(m){
    var i = slotIdx[m.time];
    String(m.ref || '').replace('主办方+','').split('/').forEach(function(c){
      c = c.trim(); if(!c) return;
      assignedAt[i] = assignedAt[i] || {}; assignedAt[i][c] = true;
    });
  });
  var changes = [], skipped = [];

  list.forEach(function(m){
    var a = resolve(m.a), b = resolve(m.b);
    if(!a || !b){ skipped.push({no:m.no, why:'对阵还没产生'}); return; }

    var i = slotIdx[m.time];
    var hostOnly = AUTOREF.hostAssist.indexOf(m.no) >= 0;
    assignedAt[i] = assignedAt[i] || {};

    var prevSame = (courtPlay[i-1] && courtPlay[i-1][m.court]) || [];
    var prevAny  = playing[i-1] || {};

    var cands = [];
    D.teams.forEach(function(t){
      var c = t.code;
      if(c === a || c === b) return;                       /* 自己在打这一场 */
      if(playing[i] && playing[i][c]) return;              /* 同时段在另一片场地打球 */
      if(assignedAt[i][c]) return;                         /* 同时段已经派去另一片场地 */

      /* 提前离场的队（昇凯）只吹到指定时段为止 */
      if(AUTOREF.earlyLeaveName && (t.name || '').indexOf(AUTOREF.earlyLeaveName) >= 0
         && i > leaveMax) return;

      var gone = (lastSlot[c] === undefined) || (lastSlot[c] < i);   /* 自己的比赛全打完了 */
      if(gone && isHkMo(t)) return;                        /* 港澳队打完就走，硬性不排 */

      var stay = 0;                                        /* 人还在场边 */
      if(prevSame.indexOf(c) >= 0) stay = 2;
      else if(prevAny[c]) stay = 1;

      /* 下一时段自己就要上场，尽量让他们歇着 */
      var nextPlay = (playing[i+1] && playing[i+1][c]) ? 1 : 0;

      /* 刚吹过没多久，先歇两场 */
      var recent = ((assignedAt[i-1] && assignedAt[i-1][c]) ||
                    (assignedAt[i-2] && assignedAt[i-2][c])) ? 1 : 0;

      cands.push({ code:c, load:load[c], stay:stay, next:nextPlay,
                   recent:recent, soft: gone ? 1 : 0 });
    });

    if(!cands.length){
      m.ref = '主办方';
      changes.push({no:m.no, ref:'主办方', why:'没有可派的队伍，由主办方顶上'});
      return;
    }

    cands.sort(function(x,y){
      if(x.soft !== y.soft) return x.soft - y.soft;        /* 已完赛的广东队放最后 */
      /* 吹得少的优先；刚吹过的要「多欠 0.75 场」才会被再叫上 */
      var lx = x.load + x.recent * 0.75, ly = y.load + y.recent * 0.75;
      if(lx !== ly) return lx - ly;
      if(x.recent !== y.recent) return x.recent - y.recent;
      if(x.next !== y.next) return x.next - y.next;        /* 下一场就要自己上的放后面 */
      if(x.stay !== y.stay) return y.stay - x.stay;        /* 刚打完还在场边的优先 */
      return x.code < y.code ? -1 : 1;
    });

    var pick = cands[0];
    var why = ['已吹 ' + pick.load + ' 场'];
    if(pick.stay === 2) why.push('刚在本场地打完');
    else if(pick.stay === 1) why.push('上一时段刚打完');
    if(pick.soft) why.push('自己已完赛，实在排不开才用');

    if(hostOnly){
      m.ref = '主办方+' + pick.code;
      load[pick.code] += 0.5;
      why.unshift('主办方副裁，' + teamName(pick.code) + ' 出两名司线');
    }else{
      m.ref = pick.code;
      load[pick.code] += 1;
    }
    assignedAt[i][pick.code] = true;
    changes.push({no:m.no, ref:m.ref, why:why.join('，')});
  });

  clearCache();
  return { changes:changes, skipped:skipped, load:load, base:base };
}

var REF_TBD = '待定（上一场比赛队伍）';
function refLabel(m){
  var s=String(m.ref||'').trim();
  if(!s) return (m && m.no >= AUTOREF.from) ? REF_TBD : '';
  if(s.indexOf('主办方+')===0){
    var c=s.slice(4).trim();
    return '副裁 主办方 · 司线 '+teamName(c);
  }
  return s.split('/').map(function(c){c=c.trim();var t=teamByCode(c);return t?(t.name||c):c;}).join(' / ');
}

/* ----- schedule ----- */
function slotCell(m,side){
  var ref=side==='a'?m.a:m.b, i=side==='a'?0:1;
  var w=setsWon(m),fin=isFinal(m),win=fin&&(i===0?w[0]>w[1]:w[1]>w[0]);
  return '<td class="tm'+(win?' w2':'')+'">'+esc(slotLabel(ref))+'</td>';
}
/* 总览表中间那一格：大比分 + 每局比分 */
function vsCell(m){
  if(!showScore(m))return '<td class="vs">vs</td>';
  var w=setsWon(m),fin=isFinal(m);
  var sets=setList(m);
  return '<td class="vs hasc'+(fin?'':' ip')+'">'+
    '<span class="sc2">'+w[0]+':'+w[1]+'</span>'+
    (sets.length?'<span class="sd2">'+sets.map(function(s){
      return '<i>'+esc(s[0]+':'+s[1])+'</i>';}).join('')+'</span>':'')+
    (fin?'':'<span class="ipt">进行中</span>')+'</td>';
}
function ovRow(m){
  return slotCell(m,'a')+vsCell(m)+slotCell(m,'b')+
    '<td class="g2">'+esc(m.stage==='小组赛'?m.group+'组':m.stage)+'</td>'+
    '<td class="g2">'+esc(refLabel(m)||'—')+'</td>';
}
function scheduleTable(){
  var CN=13;
  var h='<div class="tbl-wrap"><table class="ovt">'+
    '<thead><tr><th>时间</th><th>场次</th><th colspan="3">场 地 一</th><th>组别</th><th>裁判</th>'+
    '<th>场次</th><th colspan="3">场 地 二</th><th>组别</th><th>裁判</th></tr></thead><tbody>';
  [{k:'d1',t:'第一天 · 9 月 26 日（六）'},{k:'d2',t:'第二天 · 9 月 27 日（日）'}].forEach(function(dy){
    h+='<tr><td class="day" colspan="'+CN+'">'+esc(dy.t)+'</td></tr>';
    var ms=D.matches.filter(function(m){return m.day===dy.k;});
    var order=[],slots={};
    ms.forEach(function(m){if(!slots[m.time]){slots[m.time]=[];order.push(m.time);}slots[m.time].push(m);});
    order.forEach(function(tm){
      var c1=slots[tm].filter(function(m){return m.court==='场地一';})[0];
      var c2=slots[tm].filter(function(m){return m.court==='场地二';})[0];
      var lv=(c1&&isLive(c1))||(c2&&isLive(c2));
      h+='<tr'+(lv?' class="live2"':'')+'><td>'+esc(tm)+'</td>';
      h+= c1?('<td class="no2">'+c1.no+'</td>'+ovRow(c1)):'<td colspan="6"></td>';
      if(c2){
        h+='<td class="no2">'+c2.no+'</td>'+ovRow(c2);
      } else h+='<td colspan="6"></td>';
      h+='</tr>';
      (D.events||[]).filter(function(e){return e.day===dy.k&&e.after===tm;}).forEach(function(e){
        h+='<tr><td class="ev" colspan="'+CN+'">'+esc(e.title)+'</td></tr>';});
    });
  });
  h+='</tbody></table></div>'+
    '<p style="font-size:11.5px;color:var(--muted-2);margin-top:9px">表格可左右滑动。比分填入后会直接显示在 vs 位置，胜方队名标金色。</p>';
  return h;
}
function viewSchedule(){
  var days=[{k:'d1',t:'第一天 · 9月26日（六）'},{k:'d2',t:'第二天 · 9月27日（日）'}];
  var sub='<div class="filters" style="margin-bottom:12px">'+
    '<button class="mini'+(UI.ssub!=='table'?' on':'')+'" data-ssub="cards">赛程卡片</button>'+
    '<button class="mini'+(UI.ssub==='table'?' on':'')+'" data-ssub="table">总览表</button></div>';
  if(UI.ssub==='table')return sub+scheduleTable();
  var h=sub+'<div class="filters">'+

function matrix(g){
  var st=standings(g),codes=D.teams.filter(function(t){return t.group===g;}).map(function(t){return t.code;});
  var res={};
  D.matches.forEach(function(m){
    if(m.stage!=='小组赛'||m.group!==g||!showScore(m))return;
    var a=resolve(m.a),b=resolve(m.b);if(!a||!b)return;
    var w=setsWon(m),fin=isFinal(m),sets=setList(m);
    res[a+'|'+b]={s:w[0]+':'+w[1],d:sets.map(function(s){return [s[0],s[1]];}),win:fin&&w[0]>w[1],fin:fin};
    res[b+'|'+a]={s:w[1]+':'+w[0],d:sets.map(function(s){return [s[1],s[0]];}),win:fin&&w[1]>w[0],fin:fin};
  });
  var h='<table class="mx"><thead><tr><th>队伍</th>'+
    codes.map(function(c){return '<th>'+esc(teamName(c))+'</th>';}).join('')+
    '<th>胜</th><th>负</th><th>积分</th><th>名次</th></tr></thead><tbody>';
  codes.forEach(function(c){
    var r=st.rows.filter(function(x){return x.code===c;})[0]||{w:0,l:0,pts:0,rank:'—'};
    h+='<tr><th>'+esc(teamName(c))+'</th>';
    codes.forEach(function(o){
      if(o===c){h+='<td class="self">—</td>';return;}
      var v=res[c+'|'+o];
      if(!v){h+='<td></td>';return;}
      var det=v.d.length?('<small>'+v.d.map(function(s){
        var n0=Number(s[0]),n1=Number(s[1]);
        return '<i'+(n0<n1?' class="l"':'')+'>'+esc(s[0]+':'+s[1])+'</i>';}).join('')+'</small>'):'';
      h+='<td class="res'+(v.win?' win':'')+(v.fin?'':' ip')+'">'+v.s+det+
           (v.fin?'':'<span class="ipt2">进行中</span>')+'</td>';
    });
    h+='<td>'+r.w+'</td><td>'+r.l+'</td><td>'+r.pts+'</td><td>'+r.rank+'</td></tr>';
  });
  return h+'</tbody></table>';
}

function pgToken(){

function pgHeaders(extra){
  var h={'Accept-Profile':'public','Content-Profile':'public','Accept':'application/json',
         'Content-Type':'application/json','apikey':CLOUD.key,'Authorization':'Bearer '+pgToken()};
  if(extra)for(var k in extra)h[k]=extra[k];
  return h;
}
async function pgFetch(path,opt){
  opt=opt||{};
  try{
    var res=await fetch(CB.base+path,{method:opt.method||'GET',headers:pgHeaders(opt.headers),
      body:opt.body?JSON.stringify(opt.body):undefined});
    var txt=await res.text(); var data=null;
    if(txt){ try{ data=JSON.parse(txt); }catch(e){ data=txt; } }
    if(!res.ok){
      var msg=(data&&data.message)||(data&&data.error&&data.error.message)||('HTTP '+res.status);
      return {ok:false,status:res.status,msg:msg,data:data};
    }
    return {ok:true,status:res.status,data:data};
  }catch(e){ return {ok:false,status:0,msg:(e&&e.message)||'网络错误'}; }
}
/* 按主键写入（存在则覆盖） */
async function pgUpsert(table,row){
  var r=await pgFetch('/'+table,{method:'POST',body:row,
    headers:{'Prefer':'resolution=merge-duplicates,return=minimal'}});
  if(!r.ok)throw new Error(r.msg);
  return r;
}
/* 仅在主键不存在时写入；被占用时返回 false */
async function pgInsertNew(table,row){
  var r=await pgFetch('/'+table,{method:'POST',body:row,headers:{'Prefer':'return=minimal'}});
  if(r.ok)return true;
  if(r.status===409||/duplicate|unique|23505/i.test(r.msg||''))return false;
  throw new Error(r.msg);
}

/* BASE = 我这台设备上一次和云端一致时的快照。
   保存时用它来区分「我改的」和「别人改的」，两边都保住，不再互相覆盖。 */
var BASE=null;
function snapBase(){ try{ BASE=JSON.parse(JSON.stringify(D)); }catch(e){ BASE=null; } }
function sameJson(a,b){ return JSON.stringify(a===undefined?null:a)===JSON.stringify(b===undefined?null:b); }

/* 以云端最新版 C 为底，只把「我确实改动过」的字段盖上去 */
function mergeForSave(C){
  var out=JSON.parse(JSON.stringify(C));
  var mine=0, theirs=0, hitList=[];

  /* 顶层：meta / 公告 / 直播 / 相册 / 奖项 / 抽签 等，整块比较 */
  Object.keys(D).forEach(function(k){
    if(k==='matches'||k==='teams')return;
    if(!sameJson(D[k],BASE[k])){ out[k]=JSON.parse(JSON.stringify(D[k])); mine++; }
  });
  if(!out.matches)out.matches=[];
  if(!out.teams)out.teams=[];

  /* 比赛：一场一场、一个字段一个字段地比 */
  var bm={},om={};
  (BASE.matches||[]).forEach(function(m){bm[m.no]=m;});
  out.matches.forEach(function(m){om[m.no]=m;});
  var MF=['time','court','ref','status','sets','stage','group','day','a','b'];
  (D.matches||[]).forEach(function(m){
    var b=bm[m.no], o=om[m.no];
    if(!o){ out.matches.push(JSON.parse(JSON.stringify(m))); mine++; return; }
    if(!b)return;
    MF.forEach(function(f){
      var iChanged=!sameJson(m[f],b[f]);
      var theyChanged=!sameJson(o[f],b[f]);
      if(iChanged){ o[f]=JSON.parse(JSON.stringify(m[f])); mine++; }
      else if(theyChanged){ theirs++; if(f==='sets'||f==='status'){ if(hitList.indexOf(m.no)<0)hitList.push(m.no); } }
    });
  });

  /* 队伍：同样逐字段 */
  var bt={},ot={};
  (BASE.teams||[]).forEach(function(t){bt[t.code]=t;});
  out.teams.forEach(function(t){ot[t.code]=t;});
  var TF=['name','region','intro','roster','group'];
  (D.teams||[]).forEach(function(t){
    var b=bt[t.code], o=ot[t.code];
    if(!o||!b)return;
    TF.forEach(function(f){
      if(!sameJson(t[f],b[f])){ o[f]=JSON.parse(JSON.stringify(t[f])); mine++; }
      else if(!sameJson(o[f],b[f])) theirs++;
    });
  });

  out.matches.sort(function(x,y){return x.no-y.no;});
  return {data:out, mine:mine, theirs:theirs, hits:hitList};
}

async function cloudLoad(){
  if(!CB.on)return false;
  var r=await pgFetch('/site?select=payload&key=eq.main&limit=1');
  if(!r.ok){ CB.err=r.msg; return false; }
  var row=(r.data&&r.data.length)?r.data[0]:null;
  if(row&&row.payload){
    try{
      var p=(typeof row.payload==='string')?JSON.parse(row.payload):row.payload;
      Object.keys(p).forEach(function(k){D[k]=p[k];});
      snapBase();
      return true;
    }catch(e){ CB.err='站点数据解析失败'; }
  }
  return false;
}

/* 保存：先把云端最新拉下来合并，再整体写回。
   返回这次从别人那边合并进来的改动条数。 */
async function cloudSave(){
  if(!CB.on)throw new Error('未连接服务器');
  var theirs=0, hits=[];
  if(BASE){
    var r=await pgFetch('/site?select=payload&key=eq.main&limit=1');
    if(!r.ok)throw new Error(r.msg||'读取云端失败');
    var row=(r.data&&r.data.length)?r.data[0]:null;
    if(row&&row.payload){
      var C=null;
      try{ C=(typeof row.payload==='string')?JSON.parse(row.payload):row.payload; }catch(e){ C=null; }
      if(C){
        var mg=mergeForSave(C);
        theirs=mg.theirs; hits=mg.hits;
        Object.keys(mg.data).forEach(function(k){ D[k]=mg.data[k]; });
        clearCache();
      }
    }
  }
  D.meta.updated=new Date().toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',hour12:false});
  await pgUpsert('site',{key:'main',payload:JSON.stringify(D),ts:Date.now()});
  snapBase();
  return {theirs:theirs, hits:hits};
}

var REGIONS=[

var DRAW={slots:{},loaded:false,busy:false,fresh:null,result:null,gate:null};
function regionOf(k){for(var i=0;i<REGIONS.length;i++)if(REGIONS[i].k===k)return REGIONS[i];return null;}
function allSlots(){var o=[];['A','B'].forEach(function(g){for(var i=1;i<=6;i++)o.push(g+i);});return o;}
function normName(s){return String(s||'').replace(/\s+/g,'').toLowerCase();}

async function drawLoad(){
  if(CB.on){
    var r=await pgFetch('/draw?select=slot,team,region,ts&limit=100');
    if(r.ok){
      var m={};(r.data||[]).forEach(function(d){ if(d&&d.slot)m[d.slot]={team:d.team,region:d.region,ts:d.ts}; });
      DRAW.slots=m; DRAW.loaded=true; return;
    }

async function drawSaveSlot(slot,body){
  if(CB.on){
    var okNew=await pgInsertNew('draw',{slot:slot,team:body.team,region:body.region,ts:body.ts});
    if(!okNew)throw new Error('该位置刚被别人抽走');
    return;
  }
  if(CLOUD.env)throw new Error('未连接服务器，抽签结果无法保存');
  D.draw=D.draw||{}; D.draw.local=D.draw.local||{};
  if(D.draw.local[slot])throw new Error('该位置已被占用');
  D.draw.local[slot]=body; mark();
}
function drawFindTeam(name){
  var n=normName(name);
  var ks=Object.keys(DRAW.slots);
  for(var i=0;i<ks.length;i++){ if(normName(DRAW.slots[ks[i]].team)===n)return ks[i]; }
  return null;
}
function regionCount(rk,g){
  var n=0;Object.keys(DRAW.slots).forEach(function(s){
    if(s.charAt(0)===g&&DRAW.slots[s].region===rk)n++;});
  return n;
}
function regionLeft(rk){
  var r=regionOf(rk);if(!r)return 0;
  return (r.quota.A-regionCount(rk,'A'))+(r.quota.B-regionCount(rk,'B'));
}
function freePos(g){
  var o=[];for(var i=1;i<=6;i++){if(!DRAW.slots[g+i])o.push(g+i);}return o;
}
function pickGroup(rk){
  var r=regionOf(rk);if(!r)return null;
  var bag=[];
  ['A','B'].forEach(function(g){
    var left=r.quota[g]-regionCount(rk,g);
    if(left>0&&freePos(g).length)for(var i=0;i<left;i++)bag.push(g);
  });
  if(!bag.length)return null;
  return bag[Math.floor(Math.random()*bag.length)];
}
async function drawClaim(rk,teamName){
  if(CLOUD.env&&!CB.on)throw new Error('连不上服务器，暂时不能抽签');
  await drawLoad();
  var had=drawFindTeam(teamName);
  if(had)return {slot:had,already:true};
  for(var tries=0;tries<14;tries++){
    var g=pickGroup(rk);
    if(!g)throw new Error('该地区的名额已经抽完了');
    var free=freePos(g);
    if(!free.length){await drawLoad();continue;}
    var slot=free[Math.floor(Math.random()*free.length)];
    try{
      await drawSaveSlot(slot,{team:teamName,region:rk,ts:Date.now()});
      await drawLoad();
      if(DRAW.slots[slot]&&normName(DRAW.slots[slot].team)===normName(teamName))
        return {slot:slot};
    }catch(e){}
    await drawLoad();
    var mine=drawFindTeam(teamName);
    if(mine)return {slot:mine};
  }
  throw new Error('抽签遇到冲突，请重试一次');
}

/* 词组优先（避免「公里→公裡」「复制→復制」这类错转） */
var PHRASE={'公里':'公里','复制':'複製','联系':'聯繫','恢复':'恢復','系统':'系統'};
function convText(s){
  if(CONV)return CONV(s);
  var holds=[];
  Object.keys(PHRASE).forEach(function(k){
    s=s.split(k).join('\uE000'+holds.push(PHRASE[k])+'\uE001');
  });
  var out='';for(var i=0;i<s.length;i++)out+=(FALLBACK[s[i]]||s[i]);
  return out.replace(/\uE000(\d+)\uE001/g,function(_,n){return holds[+n-1];});
}
function walkConvert(root){
  var skip={SCRIPT:1,STYLE:1,TEXTAREA:1,INPUT:1,SELECT:1};
  var w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:function(n){
    if(skip[n.parentNode.nodeName])return NodeFilter.FILTER_REJECT;
    if(n.parentNode.hasAttribute&&n.parentNode.hasAttribute('data-nolang'))return NodeFilter.FILTER_REJECT;
    if(!/[一-鿿]/.test(n.nodeValue))return NodeFilter.FILTER_REJECT;
    return NodeFilter.FILTER_ACCEPT;}});
  var ns=[],n;while((n=w.nextNode()))ns.push(n);
  ns.forEach(function(x){x.nodeValue=convText(x.nodeValue);});
}

  var b=new TextEncoder().encode(t);

}

async function publish(){
  var btn=el('btnPub');if(btn)btn.disabled=true;
  var st=el('saveSt');
  if(CB.on){
    try{ if(st)st.textContent='保存到云端…';
      var mg=await cloudSave(); UI.dirty=false;
      if(st)st.textContent='已保存，所有人刷新即可看到';
      if(btn)btn.disabled=false;
      if(mg&&mg.theirs){
        var body=el('admBody'); if(body){var sc=body.scrollTop;body.innerHTML=adminPane();body.scrollTop=sc;}
        toast('已保存；同时合并了另一台设备的 '+mg.theirs+' 处改动'+
              (mg.hits.length?('（第 '+mg.hits.join('、')+' 场）'):''));
      }else{ toast('已保存到云端'); } }
    catch(e){ if(btn)btn.disabled=false;
      if(st)st.textContent='保存失败：'+((e&&e.message)||'请检查网络与数据库权限'); }
    return;
  }
  try{
    if(UI.artifact===null)UI.artifact=(window.claude&&claude.use)?await claude.use('artifact'):null;
    if(!UI.artifact){throw {code:'not_granted'};}
    if(st)st.textContent='发布中…';
    sessionStorage.setItem('mc_admin','1');
    await UI.artifact.publish(buildDoc());
    UI.dirty=false;
  }catch(e){
    if(btn)btn.disabled=false;
    var c=e&&e.code;
    if(c==='conflict'){if(st)st.textContent='已有更新的版本，页面即将刷新';return;}
    if(c==='not_writer'||c==='not_granted'||c==='consent_required'||c==='capability_disabled'||c==='not_declared'){
      if(st)st.textContent='此设备没有编辑权限，已改为导出文件';
      downloadDoc();return;}
    if(c==='rate_limited'){if(st)st.textContent='发布过于频繁，请稍等几秒再试';return;}
    if(st)st.textContent='发布失败，已改为导出文件';
    downloadDoc();
  }
}
async function saveFile(filename,text,mime){
  try{
    if(UI.dl===undefined)UI.dl=(window.claude&&claude.use)?await claude.use('downloads'):null;
    if(UI.dl){await UI.dl.save({filename:filename,data:new Blob([text],{type:mime})});
      toast('已保存 '+filename);return;}
  }catch(e){ toast('保存被取消'); return; }
  var blob=new Blob([text],{type:mime});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download=filename;document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},1500);
}

function onEdit(e){
  var t=e.target;
  if(t.id==='fTeam'){UI.fTeam=t.value;render();return;}
  if(t.id==='pq'){UI.q=t.value;var pane=el('p-team');
    if(pane){pane.innerHTML=viewTeams();applyLang();var i=el('pq');
      if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length);}}
    return;}
  if(t.dataset.sc!==undefined){
    var m=matchByNo(+t.dataset.sc);if(!m)return;
    if(!m.sets)m.sets=[['',''],['',''],['','']];
    while(m.sets.length<3)m.sets.push(['','']);
    var v=t.value.replace(/[^0-9]/g,'');t.value=v;
    m.sets[+t.dataset.set][+t.dataset.side]=v===''?'':+v;
    if(m.status!=='live')m.status=isFinal(m)?'final':'upcoming';
    mark();return;}
  if(t.dataset.ms!==undefined){var mm=matchByNo(+t.dataset.ms);if(mm){mm[t.dataset.f]=t.value;mark();}return;}
  if(t.dataset.tm!==undefined){
    var tm=teamByCode(t.dataset.tm);if(!tm)return;
    if(t.dataset.f==='roster'){
      tm.roster=t.value.split('\n').map(function(l){
        var p=l.split(',');if(!p[1]&&!p[0])return null;
        return {no:(p[0]||'').trim(),name:(p[1]||'').trim(),pos:(p[2]||'').trim(),
                captain:/^c$/i.test((p[3]||'').trim())};}).filter(Boolean);
    }else tm[t.dataset.f]=t.value;
    mark();return;}
  if(t.dataset.ann!==undefined){var a=D.announcements[+t.dataset.ann];
    if(t.dataset.f==='pin')a.pin=t.checked;else a[t.dataset.f]=t.value;mark();return;}
  if(t.dataset.str!==undefined){var sx=D.streams[+t.dataset.str];
    if(t.dataset.f==='live'){sx.live=t.checked;}else{sx[t.dataset.f]=t.value;}mark();return;}
  if(t.dataset.alb!==undefined){D.albums[+t.dataset.alb][t.dataset.f]=t.value;mark();return;}
  if(t.dataset.lnk!==undefined){D.links[+t.dataset.lnk][t.dataset.f]=t.value;mark();return;}
  if(t.dataset.note!==undefined){D.notes[+t.dataset.note][t.dataset.f]=t.value;mark();return;}
  if(t.dataset.pod!==undefined){D.awards.podium[t.dataset.pod]=t.value;mark();return;}
  if(t.dataset.ind!==undefined){D.awards.individual[+t.dataset.ind][t.dataset.f]=t.value;mark();return;}
  if(t.dataset.draw!==undefined){D.draw=D.draw||{};D.draw[t.dataset.draw]=t.checked;mark();return;}
  if(t.dataset.meta!==undefined){D.meta[t.dataset.meta]=t.value;mark();return;}
}

async function syncNow(){
  if(syncing||UI.dirty||DRAW.busy||DRAW.gate||DRAW.result)return;
  if(UI.admin&&!UI.authed)return;                       /* 还停在密码框 */
  var ae=document.activeElement;
  if(UI.admin&&ae&&/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName))return;   /* 正在输入，别打扰 */
  syncing=true;
  try{
    if(CB.on){
      var before=JSON.stringify(D);
      await cloudLoad(); await drawLoad();
      var changed=(JSON.stringify(D)!==before);
      if(UI.admin){
        if(changed){
          var body=el('admBody');
          if(body){ var sc=body.scrollTop; body.innerHTML=adminPane(); body.scrollTop=sc; }
          toast('已同步另一台设备刚才的改动');
        }
      }else render();
    }else if(!UI.admin)render();
  }
  finally{ syncing=false; }
}
/* 改了东西超过 45 秒还没发布，提醒一下 */
var dirtyAt=0;
setInterval(function(){
  if(!UI.dirty){dirtyAt=0;return;}
  if(!dirtyAt){dirtyAt=Date.now();return;}
  if(Date.now()-dirtyAt>45000){ dirtyAt=Date.now(); toast('还有改动没发布，记得点「发布更新」'); }
},15000);
setInterval(function(){
  if(document.hidden)return;
  if(CB.on)syncNow();
  else if(!UI.admin&&UI.tab==='home')render();
},CLOUD.env?25000:60000);
document.addEventListener('visibilitychange',function(){if(!document.hidden&&CB.on)syncNow();});
</script>
</body>
</html>
